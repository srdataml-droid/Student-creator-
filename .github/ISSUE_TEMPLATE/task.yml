name: Product or engineering task
description: Track a scoped, evidence-based Student Creators work item.
title: "[Task] "
labels: []
body:
  - type: textarea
    id: outcome
    attributes:
      label: Expected student or creator outcome
      description: What real user result will this enable?
      placeholder: A verified student can...
    validations:
      required: true
  - type: dropdown
    id: function
    attributes:
      label: Primary role/function
      options:
        - Founder / product
        - Research / growth
        - UX / product design
        - Architecture
        - Frontend
        - Backend / data
        - Payments / ledger
        - Video / live
        - Security / trust
        - QA / release
        - Infrastructure / SRE
        - Analytics / AI
        - Legal / operations
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Scope, dependencies and estimated focused hours
      description: Include existing routes, references, owner agreement, proposed hours and blocking approvals.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and adversarial tests
      description: Happy path, failure path, security/privacy, money and recovery cases.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Exact-commit evidence on completion
      description: Commit SHA, test/build results, browser/device checks, known limitations, release gate and reviewer.
