name: Unit and source guardrails
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests (no dependencies required)
        run: npm test
      - name: Verify source artefacts do not contain development secrets
        run: |
          if git ls-files | grep -E '(^|/)(\.env(\..*)?|.*\.pem|.*\.key)$' | grep -vE '\.env\.example$'; then
            echo "Tracked potential secret file"; exit 1
          fi
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install from committed lockfile
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Build Next.js app without production credentials
        working-directory: apps/web
        run: npm run build

  database-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: campus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campus_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: ci_ephemeral_only
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: campus_ci
      PGPORT: 5432
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client if missing
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply disposable Auth bootstrap, migration and SQL contract
        run: |
          psql -v ON_ERROR_STOP=1 -f db/tests/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0001_proposed_core.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0002_creator_comments.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0003_creator_public_profiles.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0004_creator_restrictions.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0005_paid_access_security.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0006_institution_identity_contract.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0007_mux_webhook_idempotency.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/0008_hosted_rls_read_grants.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/smoke.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/creator_public_profiles.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/creator_restrictions.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/comments.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/paid_access.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/institution_identity.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/mux_webhook_inbox.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/hosted_rls_isolation.sql
          psql -v ON_ERROR_STOP=1 -f tasks/W04-social/hosted-messaging.sql
          psql -v ON_ERROR_STOP=1 -f tasks/W04-social/hosted-messaging.test.sql
          psql -v ON_ERROR_STOP=1 -f tasks/W04-social/hosted-communities.sql
          psql -v ON_ERROR_STOP=1 -f tasks/W04-social/hosted-communities.test.sql
          psql -v ON_ERROR_STOP=1 -f tasks/W04-social/hosted-discovery.sql
          psql -v ON_ERROR_STOP=1 -f tasks/W04-social/hosted-discovery.test.sql
          psql -v ON_ERROR_STOP=1 -f tasks/W04-social/hosted-comments.sql
          psql -v ON_ERROR_STOP=1 -f tasks/W04-social/hosted-comments.test.sql
          psql -v ON_ERROR_STOP=1 -f tasks/W04-social/hosted-notifications.sql
          psql -v ON_ERROR_STOP=1 -f tasks/W04-social/hosted-notifications.test.sql

  browser-alpha:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned web dependencies and disposable browser tooling
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install chromium
      - name: Run synthetic student creator / moderator / viewer browser journey
        env:
          APP_DATA_MODE: local
          CI_ADMIN_EMAIL: browser-admin@example.invalid
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          export LOCAL_SQLITE_PATH="$RUNNER_TEMP/student-creators-browser.sqlite"
          export LOCAL_ADMIN_EMAIL="$CI_ADMIN_EMAIL"
          export LOCAL_ADMIN_PASSWORD="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")"
          export CI_ADMIN_PASSWORD="$LOCAL_ADMIN_PASSWORD"
          echo "::add-mask::$CI_ADMIN_PASSWORD"
          node scripts/local-admin.mjs
          npm run build --prefix apps/web
          npm run start --prefix apps/web -- -p 3000 > "$RUNNER_TEMP/student-creators-browser.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/api/local/health >/dev/null 2>&1; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/student-creators-browser.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/local/health >/dev/null || { cat "$RUNNER_TEMP/student-creators-browser.log"; exit 1; }
          (cd apps/web && npx playwright test e2e/local-alpha.spec.mjs --workers=1 --reporter=line --trace=retain-on-failure)

  browser-paid-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked web dependencies and Chromium
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Run isolated synthetic paid playback and refund regression
        env:
          APP_DATA_MODE: local
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          umask 077
          export PAYMENT_FIXTURE_FILE="$RUNNER_TEMP/paid-browser-fixture.json"
          node scripts/seed-payment-browser-fixture.mjs "$PAYMENT_FIXTURE_FILE"
          export LOCAL_SQLITE_PATH="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.PAYMENT_FIXTURE_FILE,"utf8")).path')"
          npm run build --prefix apps/web
          npm run start --prefix apps/web -- -p 3000 > "$RUNNER_TEMP/paid-browser.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -f "$PAYMENT_FIXTURE_FILE"' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/api/local/health >/dev/null 2>&1; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/local/health >/dev/null
          (cd apps/web && npx playwright test --config=playwright.payment.config.mjs --workers=1 --reporter=line)
